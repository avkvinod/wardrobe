services:
  - type: web
    name: wardrobe-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false   # Set this in Render dashboard → Environment
    autoDeploy: true
    plan: free
